<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AgenSea - Autonomous Marine AI Agent Launchpad & Treasury Protocol on Solana" />
    <title>AgenSea — Autonomous Marine AI Launchpad</title>
    
    <!-- Modern Editorial Fonts: Manrope & Outfit & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              charcoal: {
                950: '#05080f',
                900: '#080d17',
                850: '#0c1322',
                800: '#111b2e',
                700: '#1a273f',
                600: '#283958'
              },
              accent: {
                DEFAULT: '#00e5ff',
                hover: '#33ebff',
                dim: 'rgba(0, 229, 255, 0.12)',
                border: 'rgba(0, 229, 255, 0.25)'
              },
              emerald: {
                accent: '#00ffa3',
                dim: 'rgba(0, 255, 163, 0.12)'
              }
            },
            fontFamily: {
              sans: ['Manrope', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              heading: ['Outfit', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>

    <script>
      window.litDisableDevMode = true;
      globalThis.litDisableDevMode = true;
    </script>
  </head>
  <body class="bg-[#05080f] text-[#e2e8f0] font-sans antialiased overflow-x-hidden min-h-screen selection:bg-[#00e5ff] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
