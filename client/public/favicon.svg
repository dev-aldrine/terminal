<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="oceanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#092d54"/>
      <stop offset="70%" stop-color="#030b18"/>
      <stop offset="100%" stop-color="#01040a"/>
    </radialGradient>
    <linearGradient id="cyanMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#00ffa3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Ocean Backdrop -->
  <rect width="128" height="128" rx="32" fill="url(#oceanGlow)" stroke="#00d2ff" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Glowing Outer Sonar Ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.4"/>

  <!-- AgenSea Bioluminescent Fish Emblem -->
  <g filter="url(#glow)">
    <!-- Body -->
    <path d="M28 64 C42 42 82 46 98 64 C82 82 42 86 28 64 Z" fill="url(#cyanMint)"/>

    <!-- Dorsal Fin -->
    <path d="M52 48 L68 28 L72 50 Z" fill="#00d2ff" opacity="0.9"/>

    <!-- Tail Fin (Crescent Caudal) -->
    <path d="M94 64 L114 42 L106 64 L114 86 Z" fill="#00ffa3"/>

    <!-- Bioluminescent Eye -->
    <circle cx="44" cy="60" r="4.5" fill="#ffffff"/>
    <circle cx="44" cy="60" r="2.2" fill="#01040a"/>

    <!-- Angler Lure / Neural Antenna -->
    <path d="M42 54 Q36 34 50 36" fill="none" stroke="#00ffa3" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="50" cy="36" r="3.5" fill="#ffffff" filter="drop-shadow(0 0 6px #00ffa3)"/>
  </g>
</svg>